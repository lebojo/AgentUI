name: Release

on:
  push:
    tags: ['*']

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      DERIVED_DATA: ${{ github.workspace }}/DerivedData
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve version
        run: |
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Tag $TAG, version $VERSION, build $GITHUB_RUN_NUMBER"

      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('AgentUI.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Unit tests
        run: ./Tests/run.sh

      - name: Import signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -m1 'Developer ID Application' | sed -E 's/.*"(.*)"/\1/')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application identity in MACOS_CERT_P12"
            exit 1
          fi
          TEAM_ID="$(printf '%s' "$IDENTITY" | sed -E 's/.*\(([A-Z0-9]{10})\)$/\1/')"
          echo "Signing as $IDENTITY"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project AgentUI.xcodeproj \
            -scheme AgentUI \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            OTHER_CODE_SIGN_FLAGS="--timestamp --keychain $SIGNING_KEYCHAIN" \
            build

      - name: Verify signature
        run: |
          set -euo pipefail
          mkdir -p dist
          ditto "$DERIVED_DATA/Build/Products/Release/AgentUI.app" dist/AgentUI.app
          cd dist
          codesign --verify --deep --strict --verbose=2 AgentUI.app
          codesign -dv --verbose=4 AgentUI.app 2>&1 | grep -E 'Identifier|Authority|flags|TeamIdentifier'
          lipo -info AgentUI.app/Contents/MacOS/AgentUI
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' AgentUI.app/Contents/Info.plist

      - name: Notarize
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/notary.p8"
          case "$NOTARY_KEY_P8" in
            -----BEGIN*) printf '%s\n' "$NOTARY_KEY_P8" > "$KEY" ;;
            *) printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$KEY" ;;
          esac
          cd dist
          ditto -c -k --sequesterRsrc --keepParent AgentUI.app notarize.zip
          xcrun notarytool submit notarize.zip \
            --key "$KEY" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
            --wait --timeout 30m --output-format json > notary.json || true
          cat notary.json
          STATUS="$(plutil -extract status raw -o - notary.json 2>/dev/null || echo unknown)"
          if [ "$STATUS" != "Accepted" ]; then
            SUBMISSION="$(plutil -extract id raw -o - notary.json 2>/dev/null || true)"
            if [ -n "$SUBMISSION" ]; then
              xcrun notarytool log "$SUBMISSION" --key "$KEY" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" || true
            fi
            echo "::error::Notarization status: $STATUS"
            exit 1
          fi
          rm notarize.zip "$KEY"
          xcrun stapler staple AgentUI.app
          xcrun stapler validate AgentUI.app
          spctl --assess --type execute --verbose=4 AgentUI.app

      - name: Package
        run: |
          set -euo pipefail
          cd dist
          ditto -c -k --sequesterRsrc --keepParent AgentUI.app AgentUI.zip
          shasum -a 256 AgentUI.zip > AgentUI.zip.sha256
          cat AgentUI.zip.sha256

      - name: Write release notes
        run: |
          cat > dist/notes.md <<'EOF'
          ## Requirements

          - macOS 14 or later
          - Universal build: runs natively on Apple silicon and Intel Macs
          - Optional: [`gh`](https://cli.github.com) installed and authenticated (`gh auth login`) for GitHub data in the inspector

          ## Install

          1. Download and unzip `AgentUI.zip`.
          2. Move `AgentUI.app` to `/Applications` and open it.

          The app is signed with a Developer ID and notarized by Apple, so it opens like any other Mac app.

          `AgentUI.zip.sha256` contains the SHA-256 checksum of the archive (`shasum -a 256 -c AgentUI.zip.sha256`).
          EOF

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" AgentUI.zip AgentUI.zip.sha256 --clobber
          else
            gh release create "$TAG" AgentUI.zip AgentUI.zip.sha256 \
              --title "AgentUI $VERSION" \
              --notes-file notes.md \
              --generate-notes \
              --latest
          fi

      - name: Remove signing keychain
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
